name: CI
on:
  push:
    branches: ['**']
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm ci --prefix functions
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:sw
      - run: npm run test:functions
      - run: npm --prefix functions run build
      - run: npm run test:rules
      - run: npm run test:e2e
      - run: npm run test:tenant:fixture
      - run: npm run build
      - name: Dependency audit (runtime, evidence only)
        shell: bash
        run: |
          npm audit --omit=dev --json > "$RUNNER_TEMP/sushi-audit-root.json" || true
          npm --prefix functions audit --omit=dev --json > "$RUNNER_TEMP/sushi-audit-functions.json" || true
          node scripts/audit-summary.mjs "$RUNNER_TEMP/sushi-audit-root.json" "$RUNNER_TEMP/sushi-audit-functions.json"
